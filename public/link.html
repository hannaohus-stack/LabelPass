<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>라벨패스 LabelPass — 링크</title>
<meta name="description" content="내 라벨, 법에 맞는지 10분 만에 확인하세요. 라벨패스의 서비스·블로그·유튜브 링크 모음.">
<meta name="robots" content="noindex">
<meta property="og:title" content="라벨패스 LabelPass">
<meta property="og:description" content="내 라벨, 법에 맞는지 10분 만에 확인하세요">
<meta property="og:image" content="https://labelpass.kr/og/default.png">
<meta property="og:url" content="https://labelpass.kr/link">
<meta property="og:type" content="website">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--blue:#3358EE;--blue-50:#EEF2FF;--blue-100:#DCE4FF;--navy:#182136;--ink-2:#4B5873;--ink-3:#8A94A8;--line:#E4E8F0;--soft:#F4F6FB;--r:20px}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:var(--navy);
  background:linear-gradient(180deg,var(--blue-50) 0%,#fff 38%);min-height:100vh;font-size:16px;line-height:1.6;
  letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:440px;margin:0 auto;padding:52px 20px 36px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
/* 프로필 */
.avatar{width:84px;height:84px;border-radius:26px;background:var(--blue);display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(51,88,238,.28)}
.avatar svg{width:38px;height:38px;fill:#fff}
h1{margin:16px 0 0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.role{margin:4px 0 0;font-size:14px;font-weight:700;color:var(--blue);letter-spacing:.02em}
.bio{margin:12px 0 0;text-align:center;font-size:15px;color:var(--ink-2)}
.bio b{color:var(--navy)}
/* 비즈니스 제안 */
.biz{margin-top:16px;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 17px;border-radius:999px;
  background:var(--navy);color:#fff;font-weight:700;font-size:13.5px;text-decoration:none;transition:opacity .15s}
.biz:hover{opacity:.88}
.biz svg{width:15px;height:15px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* 링크 버튼 */
.links{margin-top:26px;width:100%;display:flex;flex-direction:column;gap:10px}
.lk{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:var(--r);background:#fff;border:1.5px solid var(--line);
  text-decoration:none;color:var(--navy);transition:border-color .15s,box-shadow .15s,transform .1s}
.lk:hover{border-color:var(--blue);box-shadow:0 8px 22px rgba(24,33,54,.08)}
.lk:active{transform:scale(.985)}
.lk .ic{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--blue-50)}
.lk .ic svg{width:19px;height:19px}
.lk .tx{flex:1;min-width:0}
.lk .tx b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em}
.lk .tx span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.lk .go{width:16px;height:16px;stroke:var(--ink-3);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.lk.main{background:var(--blue);border-color:var(--blue)}
.lk.main .tx b,.lk.main .tx span{color:#fff}
.lk.main .tx span{opacity:.82}
.lk.main .ic{background:rgba(255,255,255,.16)}
.lk.main .go{stroke:#fff}
.lk.main:hover{box-shadow:0 10px 26px rgba(51,88,238,.35)}
/* 푸터 */
.foot{margin-top:auto;padding-top:40px;font-size:12.5px;color:var(--ink-3);text-align:center}
.foot a{color:var(--ink-3);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main class="wrap">
  <!-- 프로필 -->
  <div class="avatar" aria-hidden="true">
    <svg viewBox="0 0 100 100"><polygon points="0,0 100,0 100,100 72,100 72,47.80 19.80,100 0,80.20 52.20,28 0,28"/></svg>
  </div>
  <h1>라벨패스 LabelPass</h1>
  <p class="role">식품 라벨 검토 서비스</p>
  <p class="bio"><b>내 라벨, 법에 맞는지 10분 만에 확인하세요.</b><br>17개 항목 검토 · 근거 법령 리포트 · 제품별 1회 결제</p>

  <!-- 비즈니스 제안 -->
  <a class="biz" href="https://labelpass.kr/contact">
    <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    비즈니스 제안 · 파트너 문의
  </a>

  <!-- 링크 -->
  <nav class="links" aria-label="라벨패스 링크">
    <a class="lk main" href="https://labelpass.kr">
      <span class="ic"><svg viewBox="0 0 100 100" fill="#fff"><polygon points="0,0 100,0 100,100 72,100 72,47.80 19.80,100 0,80.20 52.20,28 0,28"/></svg></span>
      <span class="tx"><b>LabelPass</b><span>무료 라벨 점검 시작하기</span></span>
      <svg class="go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="lk" href="https://blog.labelpass.kr">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#3358EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg></span>
      <span class="tx"><b>BLOG</b><span>표시 가이드 · 법규 소식 · 라벨 체크</span></span>
      <svg class="go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="lk" href="https://www.youtube.com/channel/UCULBIyN82GaTNyQ1-QK6Wcw" target="_blank" rel="noopener">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#3358EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="m10 9 5 3-5 3z" fill="#3358EE" stroke="none"/></svg></span>
      <span class="tx"><b>YouTube</b><span>라벨패스 채널</span></span>
      <svg class="go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </nav>

  <footer class="foot">
    LabelPass © 2026 · <a href="https://labelpass.kr/service">서비스 소개</a> · <a href="https://labelpass.kr/pricing">요금안내</a>
  </footer>
</main>
</body>
</html>
